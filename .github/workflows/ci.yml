name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      # fails on vulnerabilities; unmaintained/unsound warnings are reported, not fatal
      - run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node omarchy-plugin/tests/model.test.js
      - run: node omarchy-plugin/tests/widget.test.js
      - run: node omarchy-plugin/tests/plaintext.test.js
      - run: shellcheck install.sh tests/secret-leak.sh tests/e2e.sh tests/setup-hint.sh
      - name: secrets never reach argv/env/logs (installer under strace)
        run: |
          sudo apt-get update && sudo apt-get install -y strace
          cargo build
          bash tests/secret-leak.sh target/debug/liftoff
      - name: end-to-end (real binary, fake LL2 + mock ntfy, faked clock; offline)
        run: |
          sudo apt-get install -y faketime
          bash tests/e2e.sh target/debug/liftoff
      - name: setup wizard subscribe hint (ntfy.sh default + custom server)
        run: bash tests/setup-hint.sh target/debug/liftoff

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=liftoff-${{ matrix.target }}.tar.gz
          tar -C target/release -czf "$name" liftoff
          sha256sum "$name" > "$name.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            liftoff-${{ matrix.target }}.tar.gz
            liftoff-${{ matrix.target }}.tar.gz.sha256
