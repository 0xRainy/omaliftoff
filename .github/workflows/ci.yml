name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # fails on vulnerabilities; unmaintained/unsound warnings are reported, not fatal
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node omarchy-plugin/tests/model.test.js
      - run: node omarchy-plugin/tests/widget.test.js
      - run: shellcheck install.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=liftoff-${{ matrix.target }}.tar.gz
          tar -C target/release -czf "$name" liftoff
          sha256sum "$name" > "$name.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            liftoff-${{ matrix.target }}.tar.gz
            liftoff-${{ matrix.target }}.tar.gz.sha256
