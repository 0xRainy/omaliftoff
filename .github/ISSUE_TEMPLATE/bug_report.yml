name: Bug report
description: Something in the bar widget, TUI, daemon or installer is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **remove personal data** (usernames, hostnames, ntfy topics) from logs and screenshots.
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Bar widget / popup, TUI, Daemon / notifications, install.sh, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `liftoff doctor`
      description: Redact your ntfy topic.
      render: text
  - type: input
    id: version
    attributes:
      label: OmaLiftoff version (`liftoff --version`)
  - type: input
    id: env
    attributes:
      label: Omarchy version / terminal
