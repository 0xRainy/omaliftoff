name: Feature request
description: Suggest an idea for OmaLiftoff
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: api
    attributes:
      label: Data / API impact
      description: Does it need new API calls? LL2's free tier is 15 requests/hour, so say how it fits the budget.
